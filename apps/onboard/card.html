<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Kitty card</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --card: #ffffff;
        --text: #1b1b1a;
        --muted: #6b6b66;
        --line: #e3e3de;
        --accent: #0a7cff;
        --ok: #1f8a4c;
        --bad: #c23a2b;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111110;
          --card: #1c1c1b;
          --text: #f1f1ee;
          --muted: #a2a29c;
          --line: #2f2f2d;
          --accent: #3b95ff;
          --ok: #4cc27f;
          --bad: #ef6a5a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        grid-template-columns: minmax(0, 1fr);
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px 22px;
      }
      h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 0 18px; color: var(--muted); }
      button {
        width: 100%;
        font: inherit;
        font-weight: 600;
        font-size: 17px;
        padding: 14px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        margin-top: 16px;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .form { min-height: 320px; }
      .bad { color: var(--bad); }
      .ok { color: var(--ok); font-weight: 600; }
      code {
        display: block;
        margin-top: 10px;
        padding: 12px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid var(--line);
        font-size: 13px;
        overflow-wrap: anywhere;
        user-select: all;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="/src/card.tsx"></script>
  </body>
</html>
