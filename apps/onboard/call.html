<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d1117" />
    <title>Kitty is calling</title>
    <meta property="og:title" content="📞 Incoming call from Kitty" />
    <meta property="og:description" content="Tap to answer. Kitty is an AI assistant booking for a group." />
    <meta property="og:image" content="https://kittyagent.vercel.app/og.png" />
    <style>
      :root {
        --bg-top: #1d2a3a;
        --bg-bottom: #07090c;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.62);
        --faint: rgba(255, 255, 255, 0.16);
        --accept: #30d158;
        --decline: #ff453a;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: radial-gradient(120% 80% at 50% 0%, var(--bg-top), var(--bg-bottom) 70%);
        background-color: var(--bg-bottom);
        color: var(--text);
        font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      main {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: calc(env(safe-area-inset-top) + 56px) 16px calc(env(safe-area-inset-bottom) + 48px);
        max-width: 480px;
        margin: 0 auto;
      }
      .who { text-align: center; }
      .avatar {
        width: 96px; height: 96px; margin: 0 auto 18px;
        border-radius: 50%;
        display: grid; place-items: center;
        font-size: 52px;
        background: linear-gradient(160deg, #3a4a5e, #1f2833);
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.25);
      }
      body[data-state="ringing"] .avatar { animation: ring 1.6s ease-out infinite; }
      body[data-state="speaking"] .avatar { animation: talk 0.9s ease-in-out infinite; }
      @keyframes ring {
        0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.28); }
        100% { box-shadow: 0 0 0 28px rgba(255, 255, 255, 0); }
      }
      @keyframes talk {
        0%, 100% { box-shadow: 0 0 0 4px rgba(48, 209, 88, 0.35); }
        50% { box-shadow: 0 0 0 14px rgba(48, 209, 88, 0.08); }
      }
      .name { font-size: 34px; font-weight: 600; letter-spacing: -0.4px; margin: 0; }
      .sub { color: var(--muted); margin: 6px 0 0; }
      .status { color: var(--muted); margin: 18px 0 0; font-variant-numeric: tabular-nums; min-height: 1.4em; }

      .captions {
        align-self: end;
        margin: 24px 0 32px;
        max-height: 34dvh;
        overflow: hidden;
        display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;
        mask-image: linear-gradient(to bottom, transparent, #000 30%);
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%);
      }
      .line { font-size: 15px; color: var(--muted); margin: 0; }
      .line.agent { color: var(--text); }
      .line b { font-weight: 600; color: var(--muted); margin-right: 6px; }

      .controls {
        display: flex; justify-content: space-around; align-items: flex-start;
        gap: 16px;
      }
      .ctl { display: grid; justify-items: center; gap: 8px; font-size: 13px; color: var(--text); }
      .ctl button {
        width: 76px; height: 76px; border-radius: 50%; border: 0;
        display: grid; place-items: center;
        color: #fff; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.1s ease, filter 0.1s ease;
      }
      .ctl button:active { transform: scale(0.94); filter: brightness(0.9); }
      .ctl button svg { width: 34px; height: 34px; }
      .accept { background: var(--accept); }
      .decline { background: var(--decline); }
      .decline svg { transform: rotate(135deg); }
      .muted-btn { background: var(--faint); }
      .muted-btn[aria-pressed="true"] { background: #fff; color: #000; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body data-state="ringing">
    <main>
      <section class="who">
        <div class="avatar" aria-hidden="true">🐱</div>
        <h1 class="name" id="name">Kitty</h1>
        <p class="sub" id="sub">AI assistant</p>
        <p class="status" id="status" role="status">incoming call…</p>
      </section>

      <section class="captions" id="captions" aria-live="polite"></section>

      <section class="controls" id="ringing-controls">
        <div class="ctl">
          <button class="decline" id="decline" aria-label="Decline">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
          </button>
          Decline
        </div>
        <div class="ctl">
          <button class="accept" id="accept" aria-label="Accept">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
          </button>
          Accept
        </div>
      </section>

      <section class="controls" id="call-controls" hidden>
        <div class="ctl">
          <button class="muted-btn" id="mute" aria-label="Mute" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12z"/></svg>
          </button>
          mute
        </div>
        <div class="ctl">
          <button class="decline" id="hangup" aria-label="End call">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
          </button>
          end
        </div>
      </section>
    </main>
    <script type="module" src="/src/call.ts"></script>
  </body>
</html>
