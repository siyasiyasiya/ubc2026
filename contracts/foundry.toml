[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# EVM-generic: keep the contract portable across EVM chains (Arc, Base, other).
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 4

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
